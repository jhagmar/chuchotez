[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is a compile-time dep of hax-lib, which libcrux HMAC/AES/KEM require" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
    { crate = "shlex@1", reason = "bindgen 0.72 (crabgrind via libcrux-secrets) requires shlex 1; cc requires shlex 2" },
    { crate = "syn@3", reason = "serde_derive (hax-lib-macros-types) requires syn 3; libcrux macros require syn 2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
