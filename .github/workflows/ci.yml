name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy, llvm-tools-preview
      - name: Cache
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - name: Install cargo-llvm-cov and cargo-deny
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov,cargo-deny
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Clippy wasm32
        run: cargo clippy --workspace --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Layering
        run: python3 scripts/layering.py
      - name: Deny
        run: cargo deny check
      - name: Test
        run: cargo test --workspace --locked
      - name: Wasm32
        run: cargo build --workspace --locked --target wasm32-unknown-unknown
      - name: Docs
        run: cargo doc --workspace --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Coverage
        run: cargo llvm-cov --workspace --locked --fail-under-lines 100 --lcov --output-path lcov.info
      - name: Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: false
