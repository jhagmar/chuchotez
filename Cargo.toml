[workspace]
resolver = "3"
members = [
    "crates/chuchotez",
    "crates/chuchotez-adapters",
    "crates/chuchotez-domain",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/jhagmar/chuchotez"
homepage = "https://github.com/jhagmar/chuchotez"
authors = ["Jonas Hagmar <jonas.hagmar@protonmail.com>"]
publish = false

[workspace.dependencies]
chuchotez = { path = "crates/chuchotez", version = "0.1.0" }
chuchotez-adapters = { path = "crates/chuchotez-adapters", version = "0.1.0" }
chuchotez-domain = { path = "crates/chuchotez-domain", version = "0.1.0" }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
base64ct = { version = "1.8", default-features = false, features = ["alloc"] }
libcrux-hmac = "0.0.8"
libcrux-aes = "0.0.9"
libcrux-kem = "0.0.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
